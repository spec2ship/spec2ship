# Workflow profile: specs
# Schema: skills/roundtable-execution/references/profile-schema.md
# Consumed by: phase-2-core.md (Phase 2 Round Loop), commands/specs.md (Phase 1/3 inline)

workflow_type: "specs"

topic:
  pattern: "Requirements definition for {project_name}"
  source: "context-snapshot.project_name"

state_phase: "requirements"

# Plugin fallback. Consumed only when .s2s/config.yaml omits roundtable.strategy.by_workflow_type[specs].
# Full resolution hierarchy: references/strategy-resolution.md (TECH-002 Phase 4, ADR-0011 addendum).
default_strategy: "consensus-driven"
strategy_constraints:
  allowed:
    - "standard"
    - "consensus-driven"
    - "debate"
    - "six-hats"
  forced: false

participants:
  default:
    - "product-manager"
    - "ux-researcher"
    - "business-analyst"
    - "qa-lead"
    - "technical-lead"    # VKT-035: technical feasibility voice in the requirements panel
  configurable: true      # VKT-061: --participants may override this panel

artifact_types:
  - prefix: "REQ"
    session_key: "requirements"
    is_primary: true
  - prefix: "BR"
    session_key: "business_rules"
    is_primary: true
  - prefix: "NFR"
    session_key: "nfr"
    is_primary: true
  - prefix: "EX"
    session_key: "exclusions"
    is_primary: false
  - prefix: "OQ"
    session_key: "open_questions"
    is_primary: false
  - prefix: "CONF"
    session_key: "conflicts"
    is_primary: false

progress:
  axis: "agenda"
  agenda_count: 6
  agenda_reference: "references/agenda-specs.md"
  changes_field: "agenda_changes"
  synthesis_input_fields:
    - "full_agenda"
    - "focus_topic"
  synthesis_output_field: "agenda_update"

round_summary:
  tag_field: "topic_id"

next_values:
  - "continue"
  - "conclude"
  - "escalate"

has_phase_transition: false

display_block_style: "minimal"
